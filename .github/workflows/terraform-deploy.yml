name: Deploy dev, staging and production

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/terraform-deploy.yml'
      - 'scripts/staging-cost.py'
      - 'environments/staging/**'
      - 'modules/azure/**'
      - 'modules/ovh/**'
  workflow_dispatch:
    inputs:
      verify_hcp:
        description: Verify workspace access and state without deploying
        type: boolean
        default: false
      deploy:
        description: Apply the release after estimating staging costs
        type: boolean
        default: false
      dev_provider:
        description: Development provider
        type: choice
        options: [azure, ovh]
        default: azure
      allow_switch:
        description: Allow destruction of the old dev or staging when switching providers
        type: boolean
        default: false
      deploy_prod:
        description: Promote to OVH production after staging succeeds
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('finops-pr-{0}', github.event.pull_request.number) || 'terraform-release' }}
  cancel-in-progress: false

jobs:
  estimate:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
    permissions:
      contents: read
      actions: read
    outputs:
      staging_provider: ${{ steps.cost.outputs.provider }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Terraform CI for this revision
        if: inputs.deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/terraform-ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f event=push -f branch=main \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length' \
            | grep -Ex '[1-9][0-9]*'
      - name: Report missing Infracost API key
        if: env.INFRACOST_API_KEY == ''
        run: |
          echo 'Tarif Azure non vérifié : secret INFRACOST_API_KEY absent.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then exit 1; fi
      - name: Cross-check Spain Central retail meters
        if: github.event_name == 'pull_request' && env.INFRACOST_API_KEY == ''
        run: |
          python3 - <<'PY'
          import json
          from urllib.parse import urlencode
          from urllib.request import urlopen
          filters = [
              "armSkuName eq 'Standard_B2ats_v2' and priceType eq 'Consumption'",
              "serviceName eq 'Storage' and (skuName eq 'P6 LRS' or skuName eq 'E3 LRS')",
              "serviceName eq 'Load Balancer'",
              "serviceName eq 'Virtual Network' and contains(meterName, 'IP')",
          ]
          for clause in filters:
              url = "https://prices.azure.com/api/retail/prices?" + urlencode({
                  "currencyCode": "'EUR'",
                  "$filter": "armRegionName eq 'spaincentral' and (" + clause + ")",
              })
              with urlopen(url, timeout=30) as response:
                  data = json.load(response)
              for row in data["Items"]:
                  print("METER", *(row.get(k) for k in (
                      "productName", "skuName", "meterName", "unitOfMeasure", "retailPrice",
                      "tierMinimumUnits", "type", "currencyCode",
                  )), sep=" | ")
          PY
      - uses: infracost/actions/setup@v3
        if: env.INFRACOST_API_KEY != ''
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          currency: EUR
      - name: Compare staging prices
        id: cost
        if: env.INFRACOST_API_KEY != ''
        run: |
          infracost breakdown \
            --path environments/staging/azure \
            --format json --out-file "$RUNNER_TEMP/azure-cost.json"
          python3 scripts/staging-cost.py "$RUNNER_TEMP/azure-cost.json"

  preflight:
    if: github.ref == 'refs/heads/main' && (inputs.deploy || inputs.verify_hcp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify HCP workspaces without creating runs
        env:
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          INCLUDE_PROD: ${{ inputs.verify_hcp || inputs.deploy_prod }}
        run: |
          flags=()
          if [[ "$INCLUDE_PROD" == true ]]; then flags+=(--include-prod); fi
          python3 scripts/hcp-release.py preflight "${flags[@]}"

  dev:
    needs: [estimate, preflight]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy dev
        env:
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          PROVIDER: ${{ inputs.dev_provider }}
          ALLOW_SWITCH: ${{ inputs.allow_switch }}
        run: |
          flags=()
          if [[ "$ALLOW_SWITCH" == true ]]; then flags+=(--allow-switch); fi
          python3 scripts/hcp-release.py dev "$PROVIDER" "${flags[@]}"

  staging:
    needs: [estimate, dev]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Deploy the lowest-cost staging
        env:
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
          PROVIDER: ${{ needs.estimate.outputs.staging_provider }}
          ALLOW_SWITCH: ${{ inputs.allow_switch }}
        run: |
          flags=()
          if [[ "$ALLOW_SWITCH" == true ]]; then flags+=(--allow-switch); fi
          python3 scripts/hcp-release.py staging "$PROVIDER" "${flags[@]}"

  prod:
    needs: staging
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_prod
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote to OVH production
        env:
          HCP_TERRAFORM_TOKEN: ${{ secrets.HCP_TERRAFORM_TOKEN }}
        run: python3 scripts/hcp-release.py prod ovh
