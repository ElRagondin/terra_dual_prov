name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Dossiers vérifiés. Pour réintégrer Azure : ajouter modules/azure et environments/<env>/azure.
env:
  TF_ENVS: "environments/dev/ovh environments/staging/ovh"
  TF_MODULES: "modules/ovh"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: |
          status=0
          for dir in $TF_MODULES $TF_ENVS; do
            terraform fmt -check -recursive -diff "$dir" || status=1
          done
          exit $status

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: |
          status=0
          for dir in $TF_ENVS; do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate) || status=1
            echo "::endgroup::"
          done
          exit $status

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: |
          status=0
          for dir in $(ls -d $TF_MODULES/*/) $TF_ENVS; do
            echo "::group::$dir"
            tflint --chdir "$dir" --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact || status=1
            echo "::endgroup::"
          done
          exit $status

  trivy:
    name: Trivy (sécurité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: .
          skip-dirs: "modules/azure,environments/dev/azure,environments/staging/azure,environments/prod/azure"
          severity: HIGH,CRITICAL
          exit-code: "1"
