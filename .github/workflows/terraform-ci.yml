name: Terraform CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive -diff

  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      # Chaque dossier d'environnement (OVH et Azure) est détecté et validé, sans backend
      - run: |
          status=0
          for dir in $(find environments -name main.tf -exec dirname {} \; | sort); do
            echo "::group::$dir"
            (cd "$dir" && terraform init -backend=false -input=false >/dev/null && terraform validate) || status=1
            echo "::endgroup::"
          done
          exit $status

  tflint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact

  trivy:
    name: Trivy (sécurité)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

  policies:
    name: Policies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          VER=0.5.0
          curl -sLO "https://releases.hashicorp.com/tfpolicy/${VER}/tfpolicy_${VER}_linux_amd64.zip"
          unzip -o "tfpolicy_${VER}_linux_amd64.zip" tfpolicy
          ./tfpolicy validate --policies=policies

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.1
      - run: ./tests/run-all.sh
      - run: python3 -m unittest discover -s tests -p test_finops.py
      - name: Inspect live OVH public catalog
        if: github.head_ref == 'feature/finops-hcp-pipeline'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, re
          from urllib.request import urlopen
          url = "https://eu.api.ovh.com/1.0/order/catalog/public/cloud?ovhSubsidiary=FR"
          with urlopen(url, timeout=25) as response:
              catalog = json.load(response)
          print("Locale:", catalog.get("locale"))
          for group in ("plans", "addons"):
              for row in catalog.get(group, []):
                  code = row.get("planCode", "")
                  if re.search(r"^(c3-4[.\-]|.*(load.?balancer|floating|octavia|block.?storage|local.?storage|volume.?classic|classic.?volume|ipv4).*)", code, re.I):
                      for price in row.get("pricings", []):
                          if price.get("intervalUnit") == "hour":
                              print(code, price.get("price"), price.get("interval"), price.get("capacities"), price.get("description"))
          PY
