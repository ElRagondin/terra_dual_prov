#cloud-config
package_update: true
packages:
  - nginx
write_files:
  - path: /etc/nginx/conf.d/app.conf
    defer: true
    content: |
      # HTTP : health check du Load Balancer + redirection vers HTTPS
      server {
        listen 80;
        location = /health { return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
      }
      # HTTPS : certificat généré localement, la clé privée ne quitte jamais la VM
      server {
        listen 443 ssl;
        ssl_certificate     /etc/ssl/certs/app.crt;
        ssl_certificate_key /etc/ssl/private/app.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        root  /var/www/html;
        index index.html;
        location = /health { return 200 "ok\n"; }
      }
runcmd:
  - rm -f /etc/nginx/sites-enabled/default
  - openssl req -x509 -nodes -newkey rsa:2048 -days 365 -subj "/CN=$(hostname)" -keyout /etc/ssl/private/app.key -out /etc/ssl/certs/app.crt
  - chmod 600 /etc/ssl/private/app.key
  - echo "<h1>$(hostname)</h1>" > /var/www/html/index.html
  - systemctl restart nginx
